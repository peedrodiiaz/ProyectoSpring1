<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Añadir portero</title>
    <link rel="stylesheet" th:href="@{/css/add-futbolista.css}" />
    <link rel="stylesheet" th:href="@{/css/info-futbolista.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<div class="container py-4 add-form">
    <h3 class="mb-3">Añadir portero</h3>

    <form id="addPorteroForm" th:action="@{/futbolistas/{id}/portero/add(id=${equipo.id})}" th:object="${portero}" method="post">
        <input type="hidden" name="equipoId" th:value="${equipo.id}" />

        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" th:field="*{nombre}" required />

                <label class="form-label mt-2">Apellidos</label>
                <input class="form-control" th:field="*{apellidos}" required />
                
                <label class="form-label mt-2">Nacionalidad</label>
                <input class="form-control" th:field="*{nacionalidad}" required />
                

                <label class="form-label mt-2">Número</label>
                <input id="numCamiseta" class="form-control" type="number" th:field="*{numCamiseta}" required />

                <label class="form-label mt-2">Fecha de nacimiento</label>
                <input class="form-control" type="date" name="fechaNacimiento" id="fechaNacimiento" required
                        th:value="${portero.fechaNacimiento != null ? portero.fechaNacimiento.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Fecha inicio contrato</label>
                <input class="form-control" type="date" name="fechaInicioContrato" id="fechaInicioContrato" required
                        th:value="${portero.fechaInicioContrato != null ? portero.fechaInicioContrato.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Mano dominante</label>
                <input class="form-control" th:field="*{manoDominante}" required />


                <label class="form-label mt-2">Pierna buena</label>
                <select class="form-select" th:field="*{piernaBuena}" required>
                    <option value="Derecha">Derecha</option>
                    <option value="Izquierda">Izquierda</option>
                </select>

                <label class="form-label mt-2">Equipo</label>
                <input class="form-control" readonly th:value="${equipo != null ? equipo.nombre : ''}" />

                <label class="form-label mt-2">Imagen (URL)</label>
                <input class="form-control" type="text" th:field="*{imgFutbolista}" required />
                <div class="mt-2">
                    <img th:if="${portero.imgFutbolista != null}" th:src="${portero.imgFutbolista}" alt="foto" style="max-width:140px; border-radius:6px;" />
                </div>

                <label class="form-label mt-2">Salario base (€)</label>
                <input class="form-control" type="number" step="0.01" th:field="*{salarioMensualBase}" required />
            </div>

            <div class="col-md-6">
                <h5>Estadísticas</h5>

                <label class="form-label mt-1">Minutos jugados</label>
                <input class="form-control" type="number" step="0.1" th:field="*{minJugados}" required />

                <label class="form-label mt-1">Paradas</label>
                <input class="form-control" type="number" th:field="*{paradas}" />

                <label class="form-label mt-1">Porterías a cero</label>
                <input class="form-control" type="number" th:field="*{porteriasACero}" />

                <label class="form-label mt-1">Tarjetas amarillas</label>
                <input class="form-control" type="number" th:field="*{tarAmarilla}" />

                <label class="form-label mt-1">Tarjetas rojas</label>
                <input class="form-control" type="number" th:field="*{tarRoja}" />

                <label class="form-label mt-1">Calificación</label>
                <input class="form-control" type="number" step="0.1" max="10" min="0" th:field="*{calificacion}" />    
            </div>
        </div>

        <div id="alertContainer" class="mt-2" style="display:none;">
            <div id="alertBox" class="alert alert-danger" role="alert"></div>
        </div>

        <div class="mt-3">
            <button id="submitBtn" class="btn btn-primary">Crear portero</button>
            <a th:href="@{/equipos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
