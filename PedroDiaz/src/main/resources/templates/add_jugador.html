<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Añadir jugador</title>
    <link rel="stylesheet" th:href="@{/css/add-futbolista.css}" />
    <link rel="stylesheet" th:href="@{/css/info-futbolista.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<div class="container py-4 add-form">
    <h3 class="mb-3">Añadir jugador</h3>

    <form id="addJugadorForm" th:action="@{/futbolistas/{id}/jugador/add(id=${equipo.id})}" th:object="${jugador}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{estadisticas.id}" />
        <input type="hidden" id="equipoId" name="equipo.id" th:value="${equipo != null ? equipo.id : ''}" />

        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" th:field="*{nombre}" required />

                <label class="form-label mt-2">Apellidos</label>
                <input class="form-control" th:field="*{apellidos}" required />

                <label class="form-label mt-2">Número</label>
                <input id="numCamiseta" class="form-control" type="number" th:field="*{numCamiseta}" required />

                <label class="form-label mt-2">Fecha de nacimiento</label>
                <input class="form-control" type="date" name="fechaNacimiento" id="fechaNacimiento" required
                        th:value="${jugador.fechaNacimiento != null ? jugador.fechaNacimiento.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Fecha inicio contrato</label>
                <input class="form-control" type="date" name="fechaInicioContrato" id="fechaInicioContrato" required
                        th:value="${jugador.fechaInicioContrato != null ? jugador.fechaInicioContrato.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Posición</label>
                <input class="form-control" th:field="*{posicion}" required />

                <label class="form-label mt-2">Nacionalidad</label>
                <input class="form-control" th:field="*{nacionalidad}" required />

                <label class="form-label mt-2">Pierna buena</label>
                <select class="form-select" th:field="*{piernaBuena}" required>
                    <option value="Derecha">Derecha</option>
                    <option value="Izquierda">Izquierda</option>
                </select>

                <label class="form-label mt-2">Equipo</label>
                <!-- equipo viene del controlador como atributo 'equipo' -->
                <input type="hidden" name="equipo.id" th:value="${equipo != null ? equipo.id : ''}" />
                <input class="form-control" readonly th:value="${equipo != null ? equipo.nombre : ''}" />

                <label class="form-label mt-2">Imagen (URL)</label>
                <input class="form-control" type="text" th:field="*{imgFutbolista}" required />
                <div class="mt-2">
                    <img th:if="${jugador.imgFutbolista != null}" th:src="${jugador.imgFutbolista}" alt="foto" style="max-width:140px; border-radius:6px;" />
                </div>

                <label class="form-label mt-2">Salario base (€)</label>
                <input class="form-control" type="number" step="0.01" th:field="*{salarioMensualBase}" required />
            </div>

            <div class="col-md-6">
                <h5>Estadísticas</h5>
                <!-- Indicamos la clase concreta para que el binder cree la subclase correcta -->
                <input type="hidden" name="estadisticas.class" value="com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador" />

                <label class="form-label mt-1">Minutos jugados</label>
                <input class="form-control" type="number" step="0.1" name="estadisticas.minJugados" required
                        th:value="${jugador.estadisticas != null ? jugador.estadisticas.minJugados : ''}" />

                <label class="form-label mt-1">Goles</label>
                <input class="form-control" type="number" name="estadisticas.goles"
                        th:value="${jugador.estadisticas != null and T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador).isInstance(jugador.estadisticas) ? T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador).cast(jugador.estadisticas).goles : ''}" />

                <label class="form-label mt-1">Asistencias</label>
                <input class="form-control" type="number" name="estadisticas.asistencias"
                        th:value="${jugador.estadisticas != null and T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador).isInstance(jugador.estadisticas) ? T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador).cast(jugador.estadisticas).asistencias : ''}" />

                <label class="form-label mt-1">Tarjetas amarillas</label>
                <input class="form-control" type="number" name="estadisticas.tarAmarilla" required
                        th:value="${jugador.estadisticas != null ? jugador.estadisticas.tarAmarilla : ''}" />

                <label class="form-label mt-1">Tarjetas rojas</label>
                <input class="form-control" type="number" name="estadisticas.tarRoja" required
                        th:value="${jugador.estadisticas != null ? jugador.estadisticas.tarRoja : ''}" />

                <label class="form-label mt-1">Calificación</label>
                <input class="form-control" type="number" step="0.1" name="estadisticas.calificacion" required
                        th:value="${jugador.estadisticas != null ? jugador.estadisticas.calificacion : ''}" />
            </div>
        </div>

        <div id="alertContainer" class="mt-2" style="display:none;">
            <div id="alertBox" class="alert alert-danger" role="alert"></div>
        </div>

        <div class="mt-3">
            <button id="submitBtn" class="btn btn-primary">Crear jugador</button>
            <a th:href="@{/equipos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
