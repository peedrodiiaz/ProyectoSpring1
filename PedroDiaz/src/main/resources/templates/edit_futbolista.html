<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Editar futbolista</title>
	<link rel="stylesheet" th:href="@{/css/edit-futbolista.css}" />
	<link rel="stylesheet" th:href="@{/css/info-futbolista.css}" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>

<div class="container py-4">
	<h3 class="mb-3">Editar futbolista</h3>

	<form th:action="@{/futbolistas/{id}/edit(id=${futbolista.id})}" th:object="${futbolista}" method="post">

		<div class="row">
			<div class="col-md-6">
				<div class="mb-2">
					<label class="form-label">Nombre</label>
					<input class="form-control" type="text" th:field="*{nombre}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Apellidos</label>
					<input class="form-control" type="text" th:field="*{apellidos}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Número</label>
					<input class="form-control" type="number" th:field="*{numCamiseta}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Fecha inicio contrato</label>
					<input class="form-control" type="date" th:field="*{fechaInicioContrato}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Nacionalidad</label>
					<input class="form-control" type="text" th:field="*{nacionalidad}" />
				</div>
                <div class="mb-2">
                    <label class="form-label">Equipo</label>
                    <select name="form-select" th:field="*{equipo}">
                            <option th:each=" equipo : ${equipo}"
                                    th:value="${equipo.id}"
                                    th:text="${equipo.nombre}"
                                    th:selected="${futbolista.equipo.nombre}">                                    
                            </option>

                    </select>
                        
                </div>
				<div class="mb-2">
					<label class="form-label">Pierna buena</label>
					<select class="form-select" th:field="*{piernaBuena}">
						<option value="Derecha" th:selected="${futbolista.piernaBuena=='Derecha'}">Derecha</option>
						<option value="Izquierda" th:selected="${futbolista.piernaBuena=='Izquierda'}">Izquierda</option>
					</select>
				</div>
				<div class="mb-2">
					<label class="form-label">Salario base (€)</label>
					<input class="form-control" type="number" step="0.01" th:field="*{salarioMensualBase}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Imagen (URL)</label>
					<input class="form-control" type="text" th:field="*{imgFutbolista}" />
				</div>
			</div>

			<div class="col-md-6">
				<!-- Estadísticas comunes -->
				<h5>Estadísticas</h5>
				<div class="mb-2">
					<label class="form-label">Minutos jugados</label>
					<input class="form-control" type="number" step="0.1" th:field="*{estadisticas.minJugados}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Tarjetas amarillas</label>
					<input class="form-control" type="number" th:field="*{estadisticas.tarAmarilla}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Tarjetas rojas</label>
					<input class="form-control" type="number" th:field="*{estadisticas.tarRoja}" />
				</div>
				<div class="mb-2">
					<label class="form-label">Calificación</label>
					<input class="form-control" type="number" step="0.1" th:field="*{estadisticas.calificacion}" />
				</div>

				<!-- Bloque para JUGADOR -->
				<div th:if="${futbolista instanceof T(com.salesianostriana.dam.realbetis.Jugador.Model.Jugador)}">
					<h6 class="mt-3">Datos de jugador</h6>
					<div class="mb-2">
						<label class="form-label">Posición</label>
						<input class="form-control" type="text" th:field="*{posicion}" />
					</div>
					<div class="mb-2">
						<label class="form-label">Goles</label>
						<input class="form-control" type="number" th:field="*{estadisticas.goles}" />
					</div>
					<div class="mb-2">
						<label class="form-label">Asistencias</label>
						<input class="form-control" type="number" th:field="*{estadisticas.asistencias}" />
					</div>
				</div>

				<!-- Bloque para PORTERO -->
				<div th:if="${futbolista instanceof T(com.salesianostriana.dam.realbetis.Jugador.Model.Portero)}">
					<h6 class="mt-3">Datos de portero</h6>
					<div class="mb-2">
						<label class="form-label">Mano dominante</label>
						<select class="form-select" th:field="*{manoDominante}">
							<option value="Derecha" th:selected="${futbolista.manoDominante=='Derecha'}">Derecha</option>
							<option value="Izquierda" th:selected="${futbolista.manoDominante=='Izquierda'}">Izquierda</option>
						</select>
					</div>
					<div class="mb-2">
						<label class="form-label">Paradas</label>
						<input class="form-control" type="number" th:field="*{estadisticas.paradas}" />
					</div>
					<div class="mb-2">
						<label class="form-label">Porterías a cero</label>
						<input class="form-control" type="number" th:field="*{estadisticas.porteriasACero}" />
					</div>
				</div>

			</div>
		</div>

		<div class="mt-3 d-flex gap-2">
			<button type="submit" class="btn btn-success">Guardar</button>
			<a th:href="@{/futbolistas/{id}(id=${futbolista.id})}" class="btn btn-secondary">Cancelar</a>
		</div>

	</form>

</div>

</body>
</html>
