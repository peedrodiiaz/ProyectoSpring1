<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Editar jugador</title>
        <link rel="stylesheet" th:href="@{/css/edit-futbolista.css}" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        />
    </head>
    <body>
        <div class="container py-4 edit-form">
            <h3 class="mb-3">Editar jugador</h3>

            <form
                th:action="@{/futbolistas/jugador/{id}/edit(id=${jugador.id})}"
                th:object="${jugador}"
                method="post"
            >
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{estadisticasId}" />

                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input class="form-control" th:field="*{nombre}" />

                        <label class="form-label mt-2">Apellidos</label>
                        <input class="form-control" th:field="*{apellidos}" />

                        <label class="form-label mt-2">Número</label>
                        <input
                            class="form-control"
                            type="number"
                            th:field="*{numCamiseta}"
                        />

                        <label class="form-label mt-2">Fecha de nacimiento</label>
                        <input
                            class="form-control"
                            type="date"
                            name="fechaNacimiento"
                            th:value="${jugador.fechaNacimiento != null ? #temporals.format(jugador.fechaNacimiento, 'yyyy-MM-dd') : ''}"
                        />

                        <label class="form-label mt-2">Fecha inicio contrato</label>
                        <input
                            class="form-control"
                            type="date"
                            name="fechaInicioContrato"
                            th:value="${jugador.fechaInicioContrato != null ? #temporals.format(jugador.fechaInicioContrato, 'yyyy-MM-dd') : ''}"
                        />

                        <label class="form-label mt-2">Posición</label>
                        <input class="form-control" th:field="*{posicion}" />

                        <label class="form-label mt-2">Pierna buena</label>
                        <select class="form-select" th:field="*{piernaBuena}">
                            <option value="Derecha">Derecha</option>
                            <option value="Izquierda">Izquierda</option>
                        </select>

                        <label class="form-label mt-2">Equipo</label>
                        <select class="form-select" th:field="*{equipoId}">
                            <option
                                th:each="e : ${equipos}"
                                th:value="${e.id}"
                                th:text="${e.nombre}"
                            ></option>
                        </select>

                        <label class="form-label mt-2">Imagen (URL)</label>
                        <input
                            class="form-control"
                            type="text"
                            th:field="*{imgFutbolista}"
                        />

                        <label class="form-label mt-2">Salario base (€)</label>
                        <input
                            class="form-control"
                            type="number"
                            step="0.01"
                            th:field="*{salarioMensualBase}"
                        />
                    </div>

                    <div class="col-md-6">
                        <h5>Estadísticas</h5>

                        <label class="form-label mt-1">Minutos jugados</label>
                        <input
                            class="form-control"
                            type="number"
                            step="0.1"
                            th:field="*{minJugados}"
                        />

                        <label class="form-label mt-1">Goles</label>
                        <input class="form-control" type="number" th:field="*{goles}" />

                        <label class="form-label mt-1">Asistencias</label>
                        <input
                            class="form-control"
                            type="number"
                            th:field="*{asistencias}"
                        />

                        <label class="form-label mt-1">Tarjetas amarillas</label>
                        <input
                            class="form-control"
                            type="number"
                            th:field="*{tarAmarilla}"
                        />

                        <label class="form-label mt-1">Tarjetas rojas</label>
                        <input class="form-control" type="number" th:field="*{tarRoja}" />

                        <label class="form-label mt-1">Calificación</label>
                        <input
                            class="form-control"
                            type="number"
                            step="0.1"
                            th:field="*{calificacion}"
                        />
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn btn-success">Guardar</button>
                    <a
                        th:href="@{/futbolistas/{id}(id=${jugador.id})}"
                        class="btn btn-secondary"
                    >Cancelar</a>
                </div>
            </form>
        </div>
    </body>
</html>
