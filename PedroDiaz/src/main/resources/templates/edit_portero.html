<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Editar portero</title>
    <link rel="stylesheet" th:href="@{/css/edit-futbolista.css}" />
    <link rel="stylesheet" th:href="@{/css/info-futbolista.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<div class="container py-4 edit-form">
    <h3 class="mb-3">Editar portero</h3>
    <form th:action="@{/futbolistas/portero/{id}/edit(id=${portero.id})}" th:object="${portero}" method="post">
    
        <input type="hidden" th:field="*{id}" />
    <input type="hidden" th:field="*{estadisticas.id}" />

        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" th:field="*{nombre}" />

                <label class="form-label mt-2">Apellidos</label>
                <input class="form-control" th:field="*{apellidos}" />

                <label class="form-label mt-2">Número</label>
                <input class="form-control" type="number" th:field="*{numCamiseta}" />

                <label class="form-label mt-2">Fecha de nacimiento</label>
                <input class="form-control" type="date" name="fechaNacimiento" id="fechaNacimiento"
                    th:value="${portero.fechaNacimiento != null ? portero.fechaNacimiento.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Fecha inicio contrato</label>
                <input class="form-control" type="date" name="fechaInicioContrato" id="fechaInicioContrato"
                    th:value="${portero.fechaInicioContrato != null ? portero.fechaInicioContrato.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd')) : ''}" />

                <label class="form-label mt-2">Mano dominante</label>
                <select class="form-select" th:field="*{manoDominante}">
                    <option value="Derecha">Derecha</option>
                    <option value="Izquierda">Izquierda</option>
                </select>

                <label class="form-label mt-2">Pierna buena</label>
                <select class="form-select" th:field="*{piernaBuena}">
                    <option value="Derecha">Derecha</option>
                    <option value="Izquierda">Izquierda</option>
                </select>

                <label class="form-label mt-2">Equipo</label>
                <select class="form-select" th:field="*{equipo.id}">
                    <option th:each="e : ${equipo}" th:value="${e.id}" th:text="${e.nombre}"></option>
                </select>

                <label class="form-label mt-2">Imagen (URL)</label>
                <input class="form-control" type="text" th:field="*{imgFutbolista}" />
                <div class="mt-2">
                    <img th:if="${portero.imgFutbolista != null}" th:src="${portero.imgFutbolista}" alt="foto" style="max-width:140px; border-radius:6px;" />
                </div>

                <label class="form-label mt-2">Salario base (€)</label>
                <input class="form-control" type="number" step="0.01" th:field="*{salarioMensualBase}" />
            </div>

            <div class="col-md-6">
                <h5>Estadísticas</h5>
                <!-- Ensure binder knows which concrete subclass to create when binding nested estadisticas -->
                <input type="hidden" name="estadisticas.class" value="com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasPortero" />
                <label class="form-label mt-1">Minutos jugados</label>
                <input class="form-control" type="number" step="0.1" th:field="*{estadisticas.minJugados}" />

                <label class="form-label mt-1">Paradas</label>
                <input class="form-control" type="number" th:field="*{estadisticas.paradas}" />

                <label class="form-label mt-1">Porterías a cero</label>
                <input class="form-control" type="number" th:field="*{estadisticas.porteriasACero}" />

                <label class="form-label mt-1">Tarjetas amarillas</label>
                <input class="form-control" type="number" th:field="*{estadisticas.tarAmarilla}" />

                <label class="form-label mt-1">Tarjetas rojas</label>
                <input class="form-control" type="number" th:field="*{estadisticas.tarRoja}" />

                <label class="form-label mt-1">Calificación</label>
                <input class="form-control" type="number" step="0.1" th:field="*{estadisticas.calificacion}" />
            </div>
        </div>

        <div class="mt-3">
            <button class="btn btn-success">Guardar</button>
            <a th:href="@{/futbolistas/{id}(id=${portero.id})}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
