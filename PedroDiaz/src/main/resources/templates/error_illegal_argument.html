<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Error</title>
        <link rel="stylesheet" th:href="@{/css/info-futbolista.css}" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">RealBetis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/equipos}">Equipos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/futbolistas}">Futbolistas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Error</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Ha ocurrido un error al procesar tu petición.</p>
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <p th:if="${errorMessage == null}">Se ha producido un error inesperado. Inténtalo de nuevo más tarde.</p>

                    <div class="mt-3">
                        <a class="btn btn-primary me-2" th:href="@{/}">Inicio</a>
                        <a class="btn btn-secondary" th:href="@{/}">Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
