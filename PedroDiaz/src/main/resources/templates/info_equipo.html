<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/MainController/header-betis.css}">
    <link rel="stylesheet" th:href="@{/css/info-equipo.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}">Real Betis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/equipos}">Equipos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="header-betis py-4">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                
                <img th:if="${equipo != null and equipo.imgEquipo != null}"
                    th:src="@{${equipo.imgEquipo}}"
                    alt="Logo equipo" class="logo-betis me-3">
                <img th:if="${equipo == null or equipo.imgEquipo == null}"
                    th:src="@{/img/Escudo_Betis.svg}"
                    alt="Logo Real Betis" class="logo-betis me-3 animate__animated animate__bounceIn">

                <div>
                    <h1 class="title-betis" th:text="${equipo != null ? equipo.nombre : 'Equipo'}">Equipo</h1>
                    <p class="subtitle-betis mb-0" th:text="${equipo != null ? equipo.categoria : ''}">Categoría</p>
                </div>
            </div>

            <div class="d-flex gap-2 align-items-center mt-3 mt-md-0">
                <!-- Edit team button -->
                <a th:if="${equipo != null}" th:href="@{/equipos/{id}/edit(id=${equipo.id})}" class="btn nav-betis-link">Editar equipo</a>

                <!-- Sorting dropdown that navigates to the existing controller endpoints -->
                <div th:if="${equipo != null}" style="min-width: 160px;">
                    <select class="form-select form-select-sm" onchange="if(this.value) window.location=this.value">
                        <option th:value="@{/equipos/{id}(id=${equipo.id})}">Sin ordenar</option>
                        <option th:value="@{/equipos/{id}/ordenarMaxGoles(id=${equipo.id})}">Ordenar por goles</option>
                        <option th:value="@{/equipos/{id}/ordenarMaxAsistencias(id=${equipo.id})}">Ordenar por asistencias</option>
                    </select>
                </div>
            </div>
        </div>
        <!-- decorative escudo on the corner (keeps the MainController style) -->
        <img th:src="@{/img/Escudo_Betis.svg}" alt="escudo decorativo" class="escudo-decorativo">
    </header>

    <main class="container my-4">
        <section>
            <h2 class="h5 mb-3">Futbolistas</h2>

            <div th:if="${#lists.isEmpty(futbolistas)}" class="alert alert-info">No hay futbolistas en este equipo.</div>

            <div class="players-list">
                <!-- Each player summarized in a horizontal row (no Bootstrap card) -->
                <div class="player-row d-flex align-items-center justify-content-between mb-3 p-3" th:each="f : ${futbolistas}">
                    <div class="d-flex align-items-center">
                        <div class="player-avatar me-3">
                            <img th:if="${f.imgFutbolista != null}" th:src="@{${f.imgFutbolista}}" alt="avatar"/>
                            <div th:if="${f.imgFutbolista == null}" class="avatar-placeholder" th:text="${f.nombre.substring(0,1)}">A</div>
                        </div>
                        <div>
                            <div class="player-name fw-bold" th:text="${f.nombre}">Nombre Jugador</div>
                            <div class="player-meta text-muted">Dorsal: <span th:text="${f.numCamiseta}">10</span> · Posición: <span th:text="${f instanceof T(com.salesianostriana.dam.realbetis.Jugador.Model.Jugador) ? f.posicion : 'Portero'}">Delantero</span></div>
                        </div>
                    </div>

                    <div class="player-stats text-center mx-3">
                        <div class="stat-label text-muted">Goles</div>
                        <div class="stat-value fw-bold text-success" th:text="${f.estadisticas != null and f.estadisticas instanceof T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador) ? f.estadisticas.goles : 0}">0</div>
                    </div>

                    <div class="player-stats text-center mx-3">
                        <div class="stat-label text-muted">Asistencias</div>
                        <div class="stat-value fw-bold text-primary" th:text="${f.estadisticas != null and f.estadisticas instanceof T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador) ? f.estadisticas.asistencias : 0}">0</div>
                    </div>

                    <div class="player-actions d-flex gap-2">
                        <a th:href="@{/futbolistas/{id}(id=${f.id})}" class="btn btn-outline-primary btn-sm">Ver detalles</a>
                        <!-- Delete link: adapt to your delete mapping (POST preferred). We provide a GET link placeholder. -->
                        <a th:href="@{/equipos/{eqId}/eliminarFutbolista/{fid}(eqId=${equipo.id},fid=${f.id})}" class="btn btn-outline-danger btn-sm">Eliminar</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-light py-3 mt-5">
        <div class="container text-center text-muted small">&copy; 2025 Real Betis Balompié</div>
    </footer>

</body>
</html>
