<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info Equipo</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" th:href="@{/css/MainController/header-betis.css}">
        <link rel="stylesheet" th:href="@{/css/info-equipo.css}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand fw-bold text-success" th:href="@{/}">Real Betis</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Inicio</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <header class="header-betis py-4">
            <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
                <div class="d-flex align-items-center flex-fill">
                    <img th:if="${equipo != null and equipo.imgEquipo != null}"
                        th:src="@{${equipo.imgEquipo}}"
                        alt="Logo equipo" class="logo-betis me-3">
                    <img th:if="${equipo == null or equipo.imgEquipo == null}"
                        th:src="@{/img/Escudo_Betis.svg}"
                        alt="Logo Real Betis" class="logo-betis me-3 animate__animated animate__bounceIn">
                    <div>
                        <h1 class="title-betis" th:text="${equipo != null ? equipo.nombre : 'Equipo'}">Equipo</h1>
                        <p class="subtitle-betis mb-0" th:text="${equipo != null ? equipo.categoria : ''}">Categoría</p>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center mt-3 mt-md-0 flex-fill justify-content-md-end">
                    <a th:if="${equipo != null}" th:href="@{/equipos/{id}/edit(id=${equipo.id})}" class="btn btn-sm nav-betis-link" style="max-width:170px">Editar equipo</a>
                    <select class="form-select form-select-sm" style="max-width:170px; font-size:0.98rem;" onchange="window.location=this.value">
                        <option selected value="">Añadir futbolista</option>
                        <option th:value="@{/futbolistas/{id}/jugador/add(id=${equipo.id})}">Jugador</option>
                        <option th:value="@{/futbolistas/{id}/portero/add(id=${equipo.id})}">Portero</option>
                    </select>
                    <div th:if="${equipo != null}">
                        <select class="form-select form-select-sm" style="min-width:150px; font-size:0.98rem;" onchange="window.location=this.value">
                            <option selected value="">Elige una opción</option>
                            <option th:value="@{/equipos/{id}(id=${equipo.id})}">Sin ordenar</option>
                            <option th:value="@{/equipos/{id}/ordenarMaxGoles(id=${equipo.id})}">Ordenar por goles</option>
                            <option th:value="@{/equipos/{id}/ordenarMaxAsistencias(id=${equipo.id})}">Ordenar por asistencias</option>
                        </select>
                    </div>
                    <div>
                        <a th:if="${equipo != null}" th:href="@{/estadisticas/equipo/{id}/resumen(id=${equipo.id})}" class="btn btn-sm nav-betis-link" style="max-width:170px">Ver resumen estadisiticas</a>
                    </div>
                    
                </div>
            </div>

            <img th:src="@{/img/Escudo_Betis.svg}" alt="escudo decorativo" class="escudo-decorativo">
        </header>

        <main class="container my-4">
            <section>
                <h2 class="h5 mb-3">Futbolistas</h2>

                <div th:if="${#lists.isEmpty(futbolistas)}" class="alert alert-info">No hay futbolistas en este equipo.</div>

                <div class="players-list">
                    <div class="player-row d-flex align-items-center justify-content-between mb-3 p-3" th:each="f : ${futbolistas}">
                        <div class="d-flex align-items-center">
                            <div class="player-avatar me-3">
                                <img th:if="${f.imgFutbolista != null}" th:src="@{${f.imgFutbolista}}" alt="Imagen futbolista"/>
                                <div th:if="${f.imgFutbolista == null}" class="avatar-placeholder" th:text="${f.nombre.substring(0,1)}">A</div>
                            </div>
                            <div>
                                <div class="player-name fw-bold" th:text="${f.nombre}">Nombre Jugador</div>
                                <div class="player-meta text-muted">
                                    Dorsal: <span th:text="${f.numCamiseta}">10</span>
                                    · Posición:
                                    <span th:text="${f instanceof T(com.salesianostriana.dam.realbetis.Jugador.Model.Jugador) ? f.posicion : 'Portero'}">Delantero</span>
                                </div>
                            </div>
                        </div>

                        <div th:if="${f.estadisticas != null and f.estadisticas instanceof T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasJugador)}" class="d-flex">
                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Goles</div>
                                <div class="stat-value fw-bold text-success" th:text="${f.estadisticas.goles}">0</div>
                            </div>

                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Asistencias</div>
                                <div class="stat-value fw-bold text-primary" th:text="${f.estadisticas.asistencias}">0</div>
                            </div>
                        </div>

                        <div th:if="${f.estadisticas != null and f.estadisticas instanceof T(com.salesianostriana.dam.realbetis.Estadisticas.Model.EstadisticasPortero)}" class="d-flex">
                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Paradas</div>
                                <div class="stat-value fw-bold text-success" th:text="${f.estadisticas.paradas}">0</div>
                            </div>

                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Porterías a Cero</div>
                                <div class="stat-value fw-bold text-primary" th:text="${f.estadisticas.porteriasACero}">0</div>
                            </div>
                        </div>

                        <div th:if="${f.estadisticas == null}" class="d-flex">
                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Goles</div>
                                <div class="stat-value fw-bold text-success">0</div>
                            </div>

                            <div class="player-stats text-center mx-3">
                                <div class="stat-label text-muted">Asistencias</div>
                                <div class="stat-value fw-bold text-primary">0</div>
                            </div>
                        </div>

                        <div class="player-actions d-flex gap-2">
                            <a th:href="@{/futbolistas/{id}(id=${f.id})}" class="btn btn-outline-primary btn-sm">Ver detalles</a>
                            <form th:action="@{/futbolistas/{eqid}/eliminarFutbolista/{id}(eqid=${equipo.id},id=${f.id})}" method="post" style="display:inline" onsubmit="return confirm('¿Eliminar este futbolista?');">
                                <input type="hidden" name="_method" value="delete">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bg-light py-3 mt-5">
            <div class="container text-center text-muted small">&copy; 2025 Real Betis Balompié</div>
        </footer>
    </body>
</html>
