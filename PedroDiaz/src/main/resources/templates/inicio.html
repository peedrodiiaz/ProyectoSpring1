<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Betis Balompie</title>
    <link rel="stylesheet" th:href="@{/css/MainController/header-betis.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-body">
    <header>
        <div class="header-betis text-center">
            <img th:src="@{/img/Escudo_Betis.svg}" alt="Logo Real Betis" class="logo-betis animate__animated animate__bounceIn">
            <h1 class="title-betis">Bienvenido al sitio oficial del Real Betis Balompié</h1>
            <h2 class="subtitle-betis">¡Vive la pasión verdiblanca con nosotros!</h2>
            <nav class="mt-3">
                <ul class="nav nav-pills nav-fill gap-2">
                    <li class="nav-item" th:each="equipo : ${equipos}">
                        <a class="nav-link nav-betis-link" th:href="@{'/equipos/' + ${equipo.id}}" th:text="${equipo.nombre}"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <!-- Estadísticas Generales -->
        <div class="row mb-5">
            <div class="col-md-6">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5 class="card-title">Total Equipos</h5>
                        <p class="display-3 text-success" th:text="${totalEquipos}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5 class="card-title">Total Futbolistas</h5>
                        <p class="display-3 text-success" th:text="${totalFutbolistas}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Equipos -->
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4 text-center">Nuestros Equipos</h2>
            </div>
            <div class="col-md-4" th:each="equipo : ${equipos}">
                <div class="card mb-4 shadow-sm">
                    <img th:src="@{${equipo.imgEquipo}}" class="card-img-top" alt="Equipo" style="height: 200px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${equipo.nombre}">Nombre Equipo</h5>
                        <p class="card-text">
                            <span class="badge bg-success" th:text="${equipo.categoria}">Categoría</span>
                        </p>
                        <a th:href="@{'/equipos/' + ${equipo.id}}" class="btn btn-success w-100">Ver Detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Real Betis Balompié - Todos los derechos reservados</p>
    </footer>

</body>
</html>
